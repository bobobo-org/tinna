<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f6eef1; font-family: "Noto Sans TC", sans-serif; }
  a { color: #b9265a; text-decoration: none; }
  a:hover { color: #7d1039; }
</style>
</helmet>
<section style="display:flex;flex-direction:column;gap:28px;padding:48px">
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="font-family:'Noto Serif TC',serif;font-size:26px;font-weight:700;color:#63142f;letter-spacing:.08em">緣舍命理 · 手機版</div>
    <div style="font-size:14px;color:#8a4a63">390 × 844 · 每支手機都可以直接操作</div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start">
    <sc-for list="{{ screens }}" as="s" hint-placeholder-count="6">
      <div style="flex:0 0 auto;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="padding:4px 12px;border-radius:99px;background:#b9265a;color:#fff;font-size:13px;font-weight:700">{{ s.n }}</span>
          <span style="font-family:'Noto Serif TC',serif;font-size:17px;color:#4a2130">{{ s.label }}</span>
        </div>
        <div style="width:390px;height:844px;padding:12px;border-radius:56px;background:#1f0d14;box-shadow:0 40px 80px -30px rgba(99,20,47,.6);box-sizing:content-box">
          <div style="position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:#fff8fa">
            <iframe src="{{ s.src }}" style="width:390px;height:844px;border:0;display:block"></iframe>
            <div style="position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:32px;border-radius:20px;background:#1f0d14;pointer-events:none"></div>
          </div>
        </div>
      </div>
    </sc-for>
  </div>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const f = 'site.dc.html';
    const list = [
      ['首頁', ''],
      ['選單展開', '?menu=1'],
      ['諮詢方案', '?page=services'],
      ['預約 · 選日期時段', '?page=booking&step=2&svc=love&date=auto'],
      ['預約 · 填寫資料', '?page=booking&step=3&svc=love&date=auto'],
      ['預約 · 付款', '?page=booking&step=4&svc=love&date=auto'],
    ];
    return { screens: list.map(([label, q], i) => ({ n: String(i + 1).padStart(2, '0'), label, src: f + q })) };
  }
}
</script>
</body>
</html>
